<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Back
        {
            color: rgb(0, 113, 133);
        }
        .in
        {
            color: rgb(0, 118, 0);
        }
        .Add
        {
            background-color: rgb(255, 216, 0);
            border-radius: 20px;
            border: none;
            padding: 10px;
        }
        .Buy
        {
            background-color: rgb(255, 164, 28);
            border-radius: 20px;
            border: none;
            padding: 10px;
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.in/" class="Back">Back to Amazon</a>
    <h1 class="Nike">Nike Black Running Shoes</h1>
    <p class="in">39$ - in stock</p>
    <p class="Free">Free delivery tomorrow.</p>
    <button class="Add">Add to cart</button>&nbsp;<button class="Buy">Buy now</button>
</body>
</html>
